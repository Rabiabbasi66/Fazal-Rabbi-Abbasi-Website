<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="700" cy="80" r="130" fill="#3b82f6" opacity="0.08"/>
  <circle cx="110" cy="400" r="150" fill="#8b5cf6" opacity="0.08"/>
  <circle cx="40" cy="70" r="2" fill="#60a5fa" opacity="0.4"/>
  <circle cx="760" cy="220" r="2" fill="#a78bfa" opacity="0.35"/>
  <circle cx="620" cy="30" r="1.5" fill="#34d399" opacity="0.35"/>
  <circle cx="200" cy="30" r="1.5" fill="#60a5fa" opacity="0.3"/>

  <!-- Dashboard window -->
  <rect x="36" y="48" width="728" height="352" rx="14" fill="#0b1220" stroke="#334155" stroke-width="1"/>

  <!-- Title bar -->
  <circle cx="58" cy="66" r="5" fill="#ef4444"/>
  <circle cx="76" cy="66" r="5" fill="#f59e0b"/>
  <circle cx="94" cy="66" r="5" fill="#22c55e"/>
  <text x="112" y="71" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">DevOps Monitor Pro — Infrastructure Dashboard</text>
  <line x1="36" y1="84" x2="764" y2="84" stroke="#1f2f47" stroke-width="1"/>

  <!-- Agent online pill -->
  <rect x="634" y="104" width="110" height="24" rx="12" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.5"/>
  <circle cx="650" cy="116" r="4" fill="#34d399"/>
  <text x="661" y="120" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#34d399">AGENT ONLINE</text>

  <!-- Metric tiles -->
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif">
    <rect x="56" y="104" width="216" height="92" rx="10" fill="#111c2f" stroke="#1f2f47"/>
    <text x="72" y="128" font-size="11" fill="#94a3b8" letter-spacing="1">CPU USAGE</text>
    <text x="72" y="160" font-size="26" font-weight="700" fill="#60a5fa">42%</text>
    <rect x="72" y="174" width="184" height="6" rx="3" fill="#1e293b"/>
    <rect x="72" y="174" width="77" height="6" rx="3" fill="url(#accent)"/>

    <rect x="292" y="104" width="216" height="92" rx="10" fill="#111c2f" stroke="#1f2f47"/>
    <text x="308" y="128" font-size="11" fill="#94a3b8" letter-spacing="1">RAM USAGE</text>
    <text x="308" y="160" font-size="26" font-weight="700" fill="#a78bfa">61%</text>
    <rect x="308" y="174" width="184" height="6" rx="3" fill="#1e293b"/>
    <rect x="308" y="174" width="112" height="6" rx="3" fill="#a78bfa"/>

    <rect x="528" y="104" width="216" height="92" rx="10" fill="#111c2f" stroke="#1f2f47"/>
    <text x="544" y="128" font-size="11" fill="#94a3b8" letter-spacing="1">DISK USAGE</text>
    <text x="544" y="160" font-size="26" font-weight="700" fill="#34d399">37%</text>
    <rect x="544" y="174" width="184" height="6" rx="3" fill="#1e293b"/>
    <rect x="544" y="174" width="68" height="6" rx="3" fill="#34d399"/>
  </g>

  <!-- Live chart panel -->
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif">
    <rect x="56" y="208" width="456" height="176" rx="10" fill="#111c2f" stroke="#1f2f47"/>
    <text x="72" y="232" font-size="11" fill="#94a3b8" letter-spacing="1">LIVE PERFORMANCE — CPU %</text>
    <line x1="72" y1="258" x2="496" y2="258" stroke="#1e293b" stroke-width="1"/>
    <line x1="72" y1="284" x2="496" y2="284" stroke="#1e293b" stroke-width="1"/>
    <line x1="72" y1="310" x2="496" y2="310" stroke="#1e293b" stroke-width="1"/>
    <line x1="72" y1="336" x2="496" y2="336" stroke="#1e293b" stroke-width="1"/>
    <line x1="72" y1="362" x2="496" y2="362" stroke="#1e293b" stroke-width="1"/>
    <path d="M72,330 L102,318 L132,336 L162,300 L192,312 L222,282 L252,296 L282,262 L312,276 L342,246 L372,268 L402,240 L432,258 L462,236 L496,252 L496,362 L72,362 Z" fill="url(#chartFill)"/>
    <polyline points="72,330 102,318 132,336 162,300 192,312 222,282 252,296 282,262 312,276 342,246 372,268 402,240 432,258 462,236 496,252" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="496" cy="252" r="4.5" fill="#60a5fa" stroke="#0b1220" stroke-width="2"/>
  </g>

  <!-- Alerts panel -->
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif">
    <rect x="528" y="208" width="236" height="176" rx="10" fill="#111c2f" stroke="#1f2f47"/>
    <text x="544" y="232" font-size="11" fill="#94a3b8" letter-spacing="1">RECENT ALERTS</text>

    <circle cx="552" cy="260" r="5" fill="#f59e0b"/>
    <text x="566" y="264" font-size="11" fill="#cbd5e1">High RAM on WIN-01</text>
    <text x="566" y="278" font-size="9" fill="#64748b">2m ago</text>

    <circle cx="552" cy="306" r="5" fill="#34d399"/>
    <text x="566" y="310" font-size="11" fill="#cbd5e1">Incident resolved</text>
    <text x="566" y="324" font-size="9" fill="#64748b">12m ago</text>

    <circle cx="552" cy="352" r="5" fill="#ef4444"/>
    <text x="566" y="356" font-size="11" fill="#cbd5e1">Disk &gt; 90% on WIN-02</text>
    <text x="566" y="370" font-size="9" fill="#64748b">1h ago</text>
  </g>
</svg>
